events {
    worker_connections 1024;
}

http {

    # ============================================================
    # تعريف مجموعة الخوادم الخلفية (Upstream Cluster)
    # يستخدم Round-Robin بشكل افتراضي
    # ============================================================
    upstream soar_cluster {
        server soar_backend_1:8000;
        server soar_backend_2:8000;
    }

    # ============================================================
    # [PORT 8080] - مدخل Wazuh عبر Load Balancer
    # هذا هو الـ endpoint الذي يستدعيه Wazuh لإرسال التنبيهات
    # ============================================================
    server {
        listen 8080;
        server_name _;

        # مسار إدخال تنبيهات Wazuh
        location /wazuh-ingest {
            proxy_pass         http://soar_cluster;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;

            # -------------------------------------------------------
            # إعدادات الـ Failover التلقائي
            # عند فشل أي عقدة، يُعيد التوجيه للعقدة الأخرى فوراً
            # -------------------------------------------------------
            proxy_next_upstream error timeout http_500 http_502 http_503 http_504;
            proxy_next_upstream_tries    2;
            proxy_next_upstream_timeout  5s;

            # مهلة الاتصال
            proxy_connect_timeout  3s;
            proxy_send_timeout     10s;
            proxy_read_timeout     30s;
        }

        # -------------------------------------------------------
        # [/stats] - نقطة مراقبة حالة Load Balancer لـ Uptime Kuma
        # تعيد 200 OK طالما Nginx يعمل
        # -------------------------------------------------------
        location /stats {
            return 200 '{"status":"load_balancer_healthy","cluster":"soar_cluster"}';
            add_header Content-Type application/json;
        }

        # -------------------------------------------------------
        # [/api/] - مسار وكيل لوحة التحكم → يُمرر للـ Backend Cluster
        # Dashboard تستدعي /api/stats فيُوجّهها Nginx لـ soar_cluster
        # -------------------------------------------------------
        location /api/ {
            # إزالة بادئة /api/ وإعادة التوجيه للـ cluster
            rewrite ^/api/(.*) /$1 break;
            proxy_pass         http://soar_cluster;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;

            proxy_next_upstream error timeout http_500 http_502 http_503 http_504;
            proxy_next_upstream_tries   2;
            proxy_next_upstream_timeout 5s;
        }

        # أي طلب آخر يعيد 404
        location / {
            return 404 '{"error":"endpoint_not_found"}';
            add_header Content-Type application/json;
        }
    }

    # ============================================================
    # [PORT 80] - توجيه لوحة التحكم (Streamlit Dashboard)
    # ============================================================
    server {
        listen 80;
        server_name dashboard.soar.local;

        location / {
            proxy_pass         http://frontend-dashboard:8501;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;

            # دعم WebSockets الخاصة بـ Streamlit
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
        }
    }

    # ============================================================
    # [PORT 80] - توجيه محرك العمليات (عبر Load Balancer)
    # ============================================================
    server {
        listen 80;
        server_name api.soar.local;

        location / {
            proxy_pass         http://soar_cluster;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;

            proxy_next_upstream error timeout http_500 http_502 http_503 http_504;
            proxy_next_upstream_tries   2;
            proxy_next_upstream_timeout 5s;
        }
    }

    # ============================================================
    # [PORT 80] - توجيه نظام المراقبة (Uptime Kuma)
    # ============================================================
    server {
        listen 80;
        server_name monitor.soar.local;

        location / {
            proxy_pass         http://uptime-monitor:3001;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;

            # دعم WebSockets الخاصة بـ Uptime Kuma
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
        }
    }
}